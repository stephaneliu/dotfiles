onboarding = false
# herdr configuration
# https://herdr.dev/docs/configuration/
# Regenerate the full commented default with `herdr --default-config` if
# herdr ships new keys; merge new sections in rather than starting over.

[keys]
# Same Ctrl+A prefix zellij's tmux-mode and cmux (config/cmux/cmux.json) use,
# so the muscle memory carries across all three terminal tools.
prefix = "ctrl+a"

# --- Pane focus: hjkl, unchanged from herdr's own defaults but restated here
# so the vi mapping is explicit rather than implied by an unread default.
# Matches zellij's Ctrl+hjkl / tmux-mode hjkl and cmux's focusLeft/Down/Up/Right.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Navigate-mode movement (local-only while navigate mode is open; independent
# of focus_pane_* above). Same hjkl, kept at the shipped default.
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# --- Splits: vim's own :split / :vsplit mnemonic (v = vertical dividing line,
# side-by-side panes), and "-" for a horizontal split, matching zellij/cmux.
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"

# --- Tabs (within a workspace) and workspaces (the top-level container,
# analogous to a zellij tab / cmux workspace): n/p cycle tabs, matching
# zellij's GoToNextTab/GoToPreviousTab and cmux's nextSidebarTab/prevSidebarTab.
new_tab = "prefix+c"
rename_tab = "prefix+shift+t"
next_tab = "prefix+n"
# "prefix+a" (Ctrl+A to enter prefix mode, then bare 'a') as a second way to
# go back a tab. Not the same gesture as pressing the actual prefix chord
# (Ctrl+A) twice in a row — herdr reserves that specific double-tap to send
# a literal Ctrl+A through to the pane and disables any custom binding on it.
previous_tab = ["prefix+p", "prefix+a"]
close_tab = "prefix+shift+x"
close_pane = "prefix+x"

new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
workspace_picker = "prefix+w"
# n/p are already next_tab/previous_tab (within a workspace). Plain [ and ]
# are out too (prefix+[ is vim-style scrollback nav), so workspace cycling
# gets the shifted bracket chords instead.
next_workspace = "prefix+}"
previous_workspace = "prefix+{"

# --- Everything else below matches herdr's shipped defaults; restated
# explicitly (rather than left commented) so this file is the single source
# of truth for the bindings actually in effect.
zoom = "prefix+z"
toggle_sidebar = "prefix+b"
edit_scrollback = "prefix+e"
detach = "prefix+d"
resize_mode = "prefix+r"
help = "prefix+?"
settings = "prefix+s"
reload_config = "prefix+shift+r"

[ui]
# Enable Herdr's mouse UI (pane focus/menus/selection).
# Ctrl-click opens pane links; on macOS, Shift+Cmd-click uses the outer
# terminal's link handling. Plain Cmd-click requires mouse_capture = false.
mouse_capture = true

status_indicators = "symbols"
[ui.toast]
delivery = "terminal"

[theme]
name = "solarized"
auto_switch = false
